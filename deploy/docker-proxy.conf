# Read-only Docker API for Nuvytrix: only the calls the container monitor needs.
# Everything else (inspect, exec, create, start/stop, archive = file download, logs, images)
# is refused with 403, whatever the method. Listens on 127.0.0.1 of the host only (see compose).
user root;
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 64; }

http {
  access_log off;
  client_body_temp_path /tmp/body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  server {
    listen 2375;

    # Shared secret: only the Nuvytrix API knows it. No token configured means every request fails.
    include /etc/nginx/conf.d/token.conf;
    if ($expected_token = "") { return 403; }
    if ($http_x_proxy_token != $expected_token) { return 403; }

    # Only GET (and its HEAD form) is ever passed on.
    if ($request_method !~ ^(GET|HEAD)$) { return 403; }

    location ~ ^/(v[0-9.]+/)?_ping$ { proxy_pass http://unix:/var/run/docker.sock:; }
    location ~ ^/(v[0-9.]+/)?containers/json$ { proxy_pass http://unix:/var/run/docker.sock:; }
    # Not /containers/{id}/json: inspect output includes every container's environment (secrets).
    location ~ ^/(v[0-9.]+/)?containers/[a-zA-Z0-9][a-zA-Z0-9_.-]*/stats$ {
      proxy_pass http://unix:/var/run/docker.sock:;
    }
    location / { return 403; }
  }
}
