# AdGuard Home: DNS filtering for the home network, on the Ubuntu server.
# A separate compose project (-p adguard), so deploying Nuvytrix never restarts the home's DNS.
#
#   cd deploy/adguard && docker compose -p adguard up -d
#
# Host network, because AdGuard is also the home's DHCP server (DHCP needs the LAN broadcast).
# AdGuardHome.yaml binds DNS (53) and the admin UI (3000) to the LAN address 192.168.100.27 only:
# not 0.0.0.0, not the Tailscale address, never forwarded on the router. ufw allows 53/67/3000 on
# enp4s0 only (host-setup.sh). Data lives in ./data (not in git). Recovery: docs/adguard.md.
name: adguard

services:
  adguard:
    image: adguard/adguardhome:latest
    restart: unless-stopped
    network_mode: host
    # DHCP: raw sockets for the broadcast exchange and binding to the interface.
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - NET_BIND_SERVICE
    volumes:
      - ./data/work:/opt/adguardhome/work
      - ./data/conf:/opt/adguardhome/conf
    healthcheck:
      # Resolves through itself; fails while DNS is not answering.
      test: ['CMD', 'nslookup', 'example.com', '192.168.100.27']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
