# Production deployment on the always-on Ubuntu server.
# Expects the frontend repository checked out next to this one (../nuvytrix-frontend).
# All secrets come from .env (never committed); see .env.example and README.md.

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Reachable only from the server itself (the API runs on the host network).
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      # On my server, bridge-network containers can't reach the host's DNS resolvers (Tailscale
      # MagicDNS), so package downloads during the build use the host network instead.
      network: host
    restart: unless-stopped
    # Host networking puts nmap on the LAN itself; inside a bridge network it could not see
    # ARP replies and therefore no MAC addresses.
    network_mode: host
    cap_add:
      - NET_RAW
    # Read-only: the backup disk, so the Server page can report its usage and Nuvytrix can list
    # the backup files. /proc and /sys of the host are visible without mounts (host networking,
    # no privileges needed).
    # adm (gid 4) may read sshd.log (syslog:adm 0640); nothing else is granted.
    group_add:
      - '4'
    volumes:
      - /mnt/data:/host/mnt/data:ro
      # Only sshd's lines (rsyslog copy, deploy/ssh-log/setup.sh), not all of /var/log. The
      # directory, because logrotate replaces sshd.log with a new file.
      - /var/log/nuvytrix:/host/var/log/nuvytrix:ro
    env_file: .env
    environment:
      NODE_ENV: production
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      # Bound only to the gateway of the "proxy" network below: reachable by the web container,
      # not from the LAN. Only that network's addresses may set X-Forwarded-For.
      HOST: 172.31.250.1
      TRUST_PROXY: 172.31.250.0/29
      # The read-only Docker API proxy below, reachable from the host network only.
      DOCKER_PROXY_URL: http://127.0.0.1:2375
      SSH_AUTH_LOG: /host/var/log/nuvytrix/sshd.log
      VPN_STATE_FILE: /host/var/log/nuvytrix/vpn.json
      BACKUP_DIR: /host/mnt/data/backups
      # Every project with a database; ones without a backup job show up as missing.
      BACKUP_EXPECTED: nuvytrix,staffaway,remly,focentra,veltris,homewise,portfolio
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ../nuvytrix-frontend
      network: host
    restart: unless-stopped
    # Reachable from the LAN and over Tailscale. Never forward this port on the router or put it
    # behind a public tunnel: the app can scan the network and shows the router's firewall log.
    ports:
      - '${WEB_BIND:-0.0.0.0}:${WEB_PORT:-8080}:80'
    environment:
      API_UPSTREAM: 172.31.250.1:4000
      # Only requests from Docker networks (cloudflared) may set the visitor IP via CF-Connecting-IP.
      REAL_IP_FROM: 172.16.0.0/12
    networks:
      - proxy
    depends_on:
      - api

  # Read-only view of the Docker API for the container monitor. The API never gets the socket;
  # this proxy allows only listing/inspecting containers and their stats (deploy/docker-proxy.conf).
  docker-proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    # Root inside this container is needed to open the Docker socket (root:docker 0660).
    user: '0:0'
    read_only: true
    tmpfs:
      - /tmp
      - /etc/nginx/conf.d
    environment:
      DOCKER_PROXY_TOKEN: ${DOCKER_PROXY_TOKEN:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./deploy/docker-proxy.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/docker-proxy-token.conf.template:/etc/nginx/templates/token.conf.template:ro
    ports:
      - '127.0.0.1:2375:2375'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- --header "x-proxy-token: $$DOCKER_PROXY_TOKEN" http://127.0.0.1:2375/_ping']
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  # Dedicated bridge whose gateway (172.31.250.1) is the API's listen address. Change both
  # addresses together if this subnet collides with another network on the server.
  proxy:
    ipam:
      config:
        - subnet: 172.31.250.0/29
          gateway: 172.31.250.1

volumes:
  pgdata:
